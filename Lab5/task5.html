<!DOCTYPE html>
<html lang="en">
<head>
    <title> Student Registration Form </title>
    <link rel="stylesheet" type="text/css" href="style5.css"/>
    <script src="script5.js"></script>
</head>
<body>
    <h1>Student Registration</h1>

    <div class="box">
        <form id="regForm" onsubmit="return registration()">
            <div class="row">
                <label class="req" for="fname">First Name</label>
                <input type="text" id="fname" placeholder="Enter first name">
                <div id="fnameError" class="error-msg"></div>
            </div>

            <div class="row">
                <label class="req" for="lname">Last Name</label>
                <input type="text" id="lname" placeholder="Enter last name">
                <div id="lnameError" class="error-msg"></div>
            </div>

            <div class="row">
                <label class="req" for="sid">Student ID</label>
                <input type="text" id="sid" placeholder="e.g. 23-12345-3">
                <div id="sidError" class="error-msg"></div>
            </div>

            <div class="row">
                <label class="req" for="email">Email</label>
                <input type="text" id="email" placeholder="e.g. name@student.aiub.edu">
                <div id="emailError" class="error-msg"></div>
            </div>

            <div class="row">
                <label class="req" for="credits">Credit Completed</label>
                <input type="number" id="credits">
                <div id="creditsError" class="error-msg"></div>
            </div>

            <div class="row">
                <label class="req" for="dept">Department</label>
                <select id="dept">
                    <option value="">Select Department</option>
                    <option value="CSE">CSE</option>
                    <option value="EEE">EEE</option>
                    <option value="BBA">BBA</option>
                    <option value="English">English</option>
                </select>
                <div id="deptError" class="error-msg"></div>
            </div>

            <div class="btn-area">
                <button type="submit">Submit</button>
            </div>
        </form>
    </div>

    <h2>Registered Student List</h2>
    <table>
        <thead>
            <tr>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Student ID</th>
                <th>Email</th>
                <th>Credit</th>
                <th>Department</th>
            </tr>
        </thead>
        <tbody id="studentTableBody">
        </tbody>
    </table>
</body>
</html>
